    selection rule to skip tags that do not parse, and IMPLEMENTATION.md's
    Shared Components row pinning Latest() as "Unchanged by this feature" must
    be superseded.
    The verify-sourced item TS-11 (FR7's doc comment omits the
    semver-comparison statement) needed no SPEC change of its own and was
    coverable as an ordinary rework task, but Invariant 9 makes the
    specification-change transition create no task, so TS-11 is carried into
    the re-planning rather than synthesized here. It must be covered by the
    new plan.
