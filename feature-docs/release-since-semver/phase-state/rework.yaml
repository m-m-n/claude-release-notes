last_error: >-
  Deviation recorded, not a failure. The specification-change transition's
  five steps (rework-planner-contract.md) name create-spec, create-plan,
  implement and review, and are silent on verify. This rework was
  verify-sourced and the verify step stood at status: failed with
  failed_items: [TS-11]. Leaving it there would have made develop's
  stop-condition 3 fire when the re-run reached verify again, deadlocking the
  transition the same five steps exist to enable. The orchestrator therefore
  also reset verify to status: pending with result: null and failed_items: [],
  and preserved workflow.implement.base_commit unchanged as step 3 requires.
  A second recorded fact: the transition's single spec_change record carries
  one origin pair, but this dispatch had three inputs with two distinct
  origins that reached the gate. origin_id below names the finding the
  rework-planner identified as driving the transition; the other origin and
  the unsynthesized verify item are named in reason.
spec_change:
  reason: >-
    Two review round 1 findings, folded into this verify-sourced rework at the
    user's explicit instruction, each require a SPEC.md sentence that rework
    may never write. e54225d34fad496c (the saved baseline is the listing head,
    not the semver maximum) collides with FR6's "preserves listing order
    (newest first)" and with the state-file table's definition of
    last_version; the user chose option save-max, so SPEC.md must state that
    the persisted last_version is the semver-greatest release delivered in the
    run, with FR6's result ordering left as listing order.
    158915f71d03475b (the semver invariant is enforced on read but on no write
    path) collides with FR4's read-side-only error contract; the user chose
