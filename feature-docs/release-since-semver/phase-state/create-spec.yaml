last_error: 'Deviation recorded, not a failure. The reference-impact scan enumerated fifteen stale locations
  and FR8 was written against that number. While the create-plan artifacts were being reviewed, a sixteenth
  stale location was identified: the github.Client row of the Shared Components table in feature-docs/release-notes-fetcher/IMPLEMENTATION.md,
  whose Since(version) post-condition still reads "following pagination". The planner had raised it as
  the first Open Question in IMPLEMENTATION.md. The user was asked and chose to fold it into this feature
  rather than defer it (existing-docs.sixteenth-location -> fold_into_task0001). The orchestrator therefore
  edited SPEC.md (FR8 body and TS-9) and REQUIREMENTS.md (seven "15 箇所" sites) in place, without re-entering
  create-spec through the create-spec: needs_update path and without re-dispatching spec-writer. The edits
  are confined to the count and the target enumeration; no requirement was added, removed or restated.
  The artifact digests above were recomputed after the edits. create-plan''s IMPLEMENTATION.md, VERIFICATION.md
  and tasks/task0001.md were updated in the same pass and are recorded in create-plan.yaml.


  Second record, generation 2. create-spec was re-entered with status:

  needs_update by the specification-change transition (phase-state/rework.yaml).

  This is a partial update per create-spec-phase.md Section 11: tasks, each

  step''s status beyond what the transition assigned, implement.base_commit,

  project and goal are left untouched; only the create-spec artifacts and the

  requirements upsert are written. generation was incremented to 2 and the

  resolved_input_cache re-resolved accordingly, with internal/state and

  internal/app test files added to reference_scan_targets because the two

  user decisions reach those layers.



  Third record, generation 2 completion. Two facts about the validation of

  create-spec-run-0006 (spec-writer).

  (1) Rule R1 was NOT recomputed at return for this dispatch, and a

  recomputation would have been meaningless. The spec-writer contract carries no

  digest_inputs section, so the orchestrator constructed one, and it included

  the two files spec-writer itself writes. A worker''s own output cannot serve as

  its staleness input: the recomputed digest necessarily differs after any

  successful write. Validation of this dispatch therefore rested on layer 4

  (scope: git status showed exactly the two declared targets modified and

  nothing else) and layer 5 (artifact: both files exist and their digests are

  recorded above), plus a content check that the orchestrator''s own prior edits

  survived - FR8 still reads 16 locations, SPEC AC-9 still reads 16, and

  REQUIREMENTS.md''s FR8 target table still carries the IMPLEMENTATION.md row.

  Any future spec-writer dispatch should exclude the write targets from

  digest_inputs.

  (2) spec-writer returned written_artifacts with sha256: null because its

  dispatch had no hashing tool. The orchestrator computed both digests itself

  and recorded them above, as layer 5 requires.

  '
