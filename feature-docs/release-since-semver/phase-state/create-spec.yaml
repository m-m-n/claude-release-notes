last_error: >-
  Deviation recorded, not a failure. The reference-impact scan enumerated
  fifteen stale locations and FR8 was written against that number. While the
  create-plan artifacts were being reviewed, a sixteenth stale location was
  identified: the github.Client row of the Shared Components table in
  feature-docs/release-notes-fetcher/IMPLEMENTATION.md, whose Since(version)
  post-condition still reads "following pagination". The planner had raised it
  as the first Open Question in IMPLEMENTATION.md. The user was asked and chose
  to fold it into this feature rather than defer it
  (existing-docs.sixteenth-location -> fold_into_task0001).
  The orchestrator therefore edited SPEC.md (FR8 body and TS-9) and
  REQUIREMENTS.md (seven "15 箇所" sites) in place, without re-entering
  create-spec through the create-spec: needs_update path and without
  re-dispatching spec-writer. The edits are confined to the count and the
  target enumeration; no requirement was added, removed or restated. The
  artifact digests above were recomputed after the edits. create-plan's
  IMPLEMENTATION.md, VERIFICATION.md and tasks/task0001.md were updated in the
  same pass and are recorded in create-plan.yaml.
