findings:
  - stable_id: 346813f438c55aff
    severity: medium
    category: comprehensive
    file: internal/app/app.go
    line: 149
    title: >-
      "newest" now means the semver maximum for state but the listing head for
      the email subject and body order
    description: >-
      This round changed the state write to github.MaxByVersion (app.go:149-156)
      while items are still built in the fetcher's listing order (app.go:133-140)
      and handed to deps.Build unchanged. release-since-semver SPEC.md EC-7
      explicitly admits the two can diverge. In exactly that case the mail
      contract is violated rather than merely ambiguous: internal/mail/build.go:41
      takes newest := items[0].Version for the subject, while
      feature-docs/release-notes-fetcher/IMPLEMENTATION.md:53 states the
      mail.Build precondition as "items ordered newest first" and
      feature-docs/release-notes-fetcher/SPEC.md:28 — a file changed this round —
      still asserts "All pending releases are sent in ONE HTML email, newest
      version first". The new test TestRun_PersistsSemverMaximumOfDeliveredSet
      (internal/app/app_test.go:389-418) pins the divergent scenario as intended
      behaviour: state receives v2.2.0 while build items stay
      [v2.1.244, v2.2.0], so that run's subject reads
      "Claude Code リリースノート: v2.1.244 ほか 1 件" and the digest lists the
      older version first. The trigger is the same publish-order inversion that
      motivated FR9. User-visible but non-destructive.
    suggestion: >-
      Pick one and make the whole pipeline agree. (a) Sort the delivered set by
      semver descending before building items so items[0] is the semver maximum
      MaxByVersion persists — this satisfies mail.Build's stated precondition,
      IMPLEMENTATION.md:51/53 and release-notes-fetcher SPEC.md:28 at once; note
      release-since-semver FR6's "preserves listing order" constrains the
      fetcher's return value, not what app hands to mail, so sorting in app does
      not contradict FR6. (b) If listing order must reach the mail unchanged,
      restate "newest first" as "listing order" in release-notes-fetcher
      SPEC.md:28 and IMPLEMENTATION.md:53, and say explicitly that the subject's
      {newest} is the listing head rather than the semver maximum. Do not leave
      state on semver and mail on listing order with both documented as "newest".
    sources: [claude:comprehensive]
    confidence: 85
    resolution: unresolved
    resolution_reason: >-
      Not an auto-fix candidate: R4's candidate gate admits only critical/high.
      Both branches of the suggestion are decisions about what "newest" means to
      the user, which is a specification choice rather than a mechanical edit.
  - stable_id: aa497af6025a4610
    severity: medium
    category: architecture
    file: internal/app/app.go
    line: 40
    title: >-
      ReleaseFetcher.Latest interface doc omits the parseability filter this
      round added to the concrete implementation
    description: >-
      This round added the tag-parseability filter to github.Client.Latest
      (client.go:80-82) and updated the concrete doc comment (client.go:63-65)
      and feature-docs/release-notes-fetcher/IMPLEMENTATION.md:51, but the
      consumer-side interface doc at app.go:40 still reads only "Latest returns
      the newest non-draft, non-prerelease release." The same diff did update the
      sibling Since doc on the same interface (app.go:42-46), so the omission is
      an asymmetry introduced by this round, and it is the same class of contract
      drift as round 1's 8eee8117e5f072ef. Consequence is confined to implementers
      of the interface: app.go's Run sends the email at line 144 before
      MaxByVersion runs at line 149, so a Latest result with an unparseable tag
      produces a sent email plus an unsaved state and a duplicate delivery on the
      next run. Documentation-only fix; no behaviour change in the concrete client.
    suggestion: >-
      Extend the app.go:40 doc comment to mirror client.go:63-65, e.g. "Latest
      returns the newest non-draft, non-prerelease release whose tag name parses
      as vMAJOR.MINOR.PATCH."
    sources: [litellm:vertex-glm-5.2:architecture]
    confidence: 85
    resolution: unresolved
    resolution_reason: >-
      Not an auto-fix candidate: R4's candidate gate admits only critical/high.
