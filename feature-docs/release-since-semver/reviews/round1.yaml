findings:
  - stable_id: 8eee8117e5f072ef
    severity: medium
    category: spec
    file: internal/app/app.go
    line: 42
    title: "ReleaseFetcher.Since doc comment omits the semver-comparison statement FR7 requires"
    description: >-
      SPEC FR7 requires the doc comment on `ReleaseFetcher.Since` in
      `internal/app` to state semver comparison, single-page boundedness, and
      that an empty slice means "already up to date". The comment states
      boundedness and the empty-slice meaning but describes newness only as
      "newer than version". `internal/github/client.go` states the comparison
      explicitly, so the consumer-side interface is the only place a reader
      can still infer identity-match semantics. Verified by the orchestrator
      against SPEC.md:46 and app.go:38-46.
    suggestion: >-
      Amend the comment to name the comparison, e.g. "Since returns the
      non-draft, non-prerelease releases whose tag names compare as a newer
      semantic version than version, newest first, bounded to one listing
      page; empty slice when up to date."
    sources: ["litellm:muse-spark:spec"]
    confidence: 85
    resolution: unresolved
    resolution_reason: "auto-fix candidate gate excludes severity medium and category spec (review-phase.md R4); VERIFICATION.md TS-11 / MT-3 covers this same statement, so the verify phase evaluates it"
  - stable_id: 158915f71d03475b
    severity: medium
    category: architecture
    file: internal/github/client.go
    line: 95
    title: "The semver invariant Since hard-requires of last_version is enforced on read but on no write path"
    description: >-
      FR4 turns an unparsable stored version into a hard error with no
      fallback, but nothing enforces the invariant where the value is
      produced. `Latest()` returns the first non-draft, non-prerelease entry
      without inspecting its tag shape; `app.Run` passes that TagName straight
      to `State.Save` on the first-run branch (app.go:148-149);
      `state.Store.Save` marshals whatever string it is handed. If upstream
      ever publishes a non-semver tag as a plain release, the program writes a
      value that makes every subsequent run fail at the github stage until a
      human edits state.json. Since itself treats non-semver listing tags as
      an expected condition and skips them, so the read side is hardened and
      the write side is not. Verified by the orchestrator against app.go:100-152.
    suggestion: >-
      Keep Since's error contract as specified and close the gap on the
      producing side. Either (a) run Latest's candidate through parseVersion
      and skip tags that do not parse, matching the listing side, or (b)
      validate in app.Run before State.Save. If (b), site the check at the
      state stage so the error prefix names the layer that actually failed.
    sources: ["claude:architecture"]
    confidence: 60
    resolution: unresolved
    resolution_reason: "auto-fix candidate gate excludes severity medium (review-phase.md R4); no SPEC requirement covers the write-side invariant, so acting on it is a scope decision for the user"
  - stable_id: e54225d34fad496c
    severity: medium
    category: comprehensive
    file: internal/app/app.go
    line: 148
    title: "Saved baseline is the listing head, not the semver maximum, so an out-of-order publish causes one duplicate delivery"
    description: >-
      Evaluator-originated; no reviewer run reported it. `Since` selects by
      semver but returns in listing order, and `app.Run` saves
      `releases[0].TagName` as the new baseline. Those orderings coincide only
      while GitHub's created_at-descending listing matches semver order. When
      it does not — a patch published for an older line after a newer minor,
      listing [v2.1.244, v2.2.0] with stored v2.0.0 — the run delivers both and
      saves v2.1.244, so the next run finds v2.2.0 still strictly greater and
      delivers it a second time. It self-corrects after one extra email.
      Under the previous identity-match stop condition the same listing
      produced an empty result on the second run. Verified by the
      orchestrator against app.go:148 and client.go's Since.
    suggestion: >-
      Make the saved baseline the maximum of what was delivered rather than
      the first element: either have Since order results by semver descending,
      or expose the comparison so app.Run can select the max before
      State.Save. State the ordering key in the SPEC either way.
    sources: ["claude:evaluator"]
    confidence: 60
    resolution: unresolved
    resolution_reason: "auto-fix candidate gate excludes severity medium and sole-source claude:evaluator (review-phase.md R4); untrusted-origin, so it is surfaced for the user rather than applied"
